<svg xmlns="http://www.w3.org/2000/svg" width="860" height="220" viewBox="0 0 860 220">
  <defs>
    <linearGradient id="warm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB547"/>
      <stop offset="1" stop-color="#FF9900"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00A8E1"/>
      <stop offset="1" stop-color="#7B61FF"/>
    </linearGradient>
  </defs>
  <!-- Two stacked polaroids: the wall in miniature, with a bright star in the photo. -->
  <g transform="translate(26 30) rotate(-8 70 80)">
    <rect x="0" y="0" width="128" height="150" rx="8" fill="#FFFFFF" opacity="0.35"/>
  </g>
  <g transform="translate(40 28) rotate(6 70 80)">
    <rect x="0" y="0" width="128" height="150" rx="8" fill="#FFFFFF"/>
    <rect x="12" y="12" width="104" height="100" rx="3" fill="url(#sky)"/>
    <circle cx="82" cy="44" r="13" fill="#FF9900"/>
    <path d="M12 112 l34 -38 l26 26 l14 -14 l30 26 z" fill="#232F3E" opacity="0.55"/>
  </g>
  <text x="208" y="146" font-family="Avenir Next" font-weight="800" font-size="112" letter-spacing="-2" fill="#FFFFFF">Booth<tspan fill="url(#warm)">Wall</tspan></text>
</svg>
